name: Package Desktop Releases

on:
  pull_request:
    paths:
      - ".github/workflows/release-packaging.yml"
      - "linux/**"
      - "macos/**"
      - "packaging/**"
      - "tool/release/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-deb:
    name: Linux ${{ matrix.arch }} .deb
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            clang \
            dbus-x11 \
            desktop-file-utils \
            dpkg-dev \
            libgtk-3-dev \
            libnotify-dev \
            libx11-dev \
            ninja-build \
            pkg-config \
            xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop target
        run: flutter config --enable-linux-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check shared Windows import boundary
        run: dart run tool/check_shared_windows_imports.dart

      - name: Run Linux release regression tests
        run: flutter test test/app_paths_test.dart test/secret_crypto_test.dart test/linux_platform_test.dart test/portable_mvp_test.dart

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          [[ -n "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=$(printf '%s' "$version" | tr '+' '~')" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build Linux release bundle
        run: flutter build linux --release -t lib/portable_main.dart

      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/linux/tabame.desktop
          appstreamcli validate packaging/linux/tabame.metainfo.xml.in || true

      - name: Build reproducible Debian package
        env:
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source_date_epoch }}
        run: |
          bash tool/release/package-linux-deb.sh \
            --bundle build/linux/x64/release/bundle \
            --version '${{ steps.metadata.outputs.version }}' \
            --arch '${{ matrix.arch }}' \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Rebuild Linux package and compare bytes
        env:
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.source_date_epoch }}
        run: |
          bash tool/release/check-linux-reproducibility.sh \
            --bundle build/linux/x64/release/bundle \
            --version '${{ steps.metadata.outputs.version }}' \
            --arch '${{ matrix.arch }}' \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Validate Debian package contents
        shell: bash
        run: |
          set -Eeuo pipefail
          package="dist/tabame_${{ steps.metadata.outputs.package_version }}_${{ matrix.arch }}.deb"
          dpkg-deb --info "$package"
          extracted="$RUNNER_TEMP/tabame-deb-check"
          rm -rf "$extracted"
          mkdir -p "$extracted"
          dpkg-deb --extract "$package" "$extracted"
          desktop-file-validate "$extracted/usr/share/applications/tabame.desktop"
          appstreamcli validate "$extracted/usr/share/metainfo/com.farse.tabame.metainfo.xml"

      - name: Exercise Debian install, upgrade, and uninstall lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          package="dist/tabame_${{ steps.metadata.outputs.package_version }}_${{ matrix.arch }}.deb"
          sudo apt-get install --yes "./$package"
          dpkg-query --showformat='${Status}\n' --show tabame | grep -Fxq 'install ok installed'
          sudo apt-get install --yes "./$package"
          test -x /opt/tabame/tabame
          test -x /usr/bin/tabame
          sudo apt-get remove --yes tabame
          if dpkg-query --show tabame >/dev/null 2>&1; then
            echo 'tabame remained installed after the uninstall check.' >&2
            exit 1
          fi

      - name: Run installed-layout and cold-start smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          package="dist/tabame_${{ steps.metadata.outputs.package_version }}_${{ matrix.arch }}.deb"
          xvfb-run -a dbus-run-session -- bash -c \
            'export XDG_SESSION_TYPE=x11; bash tool/release/smoke-linux.sh --package "$1" --duration 5' \
            smoke "$package"

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tabame-${{ steps.metadata.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop target
        run: flutter config --enable-macos-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check shared Windows import boundary
        run: dart run tool/check_shared_windows_imports.dart

      - name: Run macOS release regression tests
        run: flutter test test/app_paths_test.dart test/secret_crypto_test.dart test/macos_platform_test.dart test/portable_mvp_test.dart

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          [[ -n "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build macOS release bundle
        run: flutter build macos --release -t lib/portable_main.dart

      - name: Import Developer ID signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.TABAME_APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.TABAME_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.TABAME_APPLE_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${APPLE_CERTIFICATE_P12_BASE64:-}" ]] || { echo 'Missing TABAME_APPLE_CERTIFICATE_P12_BASE64.' >&2; exit 1; }
          [[ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]] || { echo 'Missing TABAME_APPLE_CERTIFICATE_PASSWORD.' >&2; exit 1; }
          [[ -n "${APPLE_KEYCHAIN_PASSWORD:-}" ]] || { echo 'Missing TABAME_APPLE_KEYCHAIN_PASSWORD.' >&2; exit 1; }
          keychain="$RUNNER_TEMP/tabame-signing.keychain-db"
          certificate="$RUNNER_TEMP/tabame-developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain"

      - name: Prepare notarization key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.TABAME_APPLE_NOTARY_PRIVATE_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.TABAME_APPLE_NOTARY_KEY_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${APPLE_NOTARY_PRIVATE_KEY:-}" ]] || { echo 'Missing TABAME_APPLE_NOTARY_PRIVATE_KEY.' >&2; exit 1; }
          [[ -n "${APPLE_NOTARY_KEY_ID:-}" ]] || { echo 'Missing TABAME_APPLE_NOTARY_KEY_ID.' >&2; exit 1; }
          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$notary_key"
          chmod 600 "$notary_key"
          echo "TABAME_NOTARY_KEY_PATH=$notary_key" >> "$GITHUB_ENV"

      - name: Package and sign macOS DMG
        env:
          TABAME_MACOS_SIGNING_IDENTITY: ${{ secrets.TABAME_MACOS_SIGNING_IDENTITY }}
          TABAME_NOTARY_KEY_ID: ${{ secrets.TABAME_APPLE_NOTARY_KEY_ID }}
          TABAME_NOTARY_ISSUER_ID: ${{ secrets.TABAME_APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          args=(
            --app build/macos/Build/Products/Release/tabame.app
            --version '${{ steps.metadata.outputs.version }}'
            --arch '${{ matrix.arch }}'
          )
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            [[ -n "${TABAME_MACOS_SIGNING_IDENTITY:-}" ]] || { echo 'Missing TABAME_MACOS_SIGNING_IDENTITY.' >&2; exit 1; }
            [[ -n "${TABAME_NOTARY_KEY_PATH:-}" ]] || { echo 'Notarization key was not prepared.' >&2; exit 1; }
            [[ -n "${TABAME_NOTARY_KEY_ID:-}" && -n "${TABAME_NOTARY_ISSUER_ID:-}" ]] || { echo 'Notarization issuer/key ID secrets are required.' >&2; exit 1; }
            args+=(
              --signing-identity "$TABAME_MACOS_SIGNING_IDENTITY"
              --require-signed
              --notarize
              --notary-key "$TABAME_NOTARY_KEY_PATH"
              --notary-key-id "$TABAME_NOTARY_KEY_ID"
              --notary-issuer "$TABAME_NOTARY_ISSUER_ID"
            )
          fi
          bash tool/release/package-macos-dmg.sh "${args[@]}"

      - name: Run macOS DMG smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          args=(
            --dmg "dist/tabame-${{ steps.metadata.outputs.version }}-macos-${{ matrix.arch }}.dmg"
            --arch '${{ matrix.arch }}'
          )
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            args+=(--require-signed)
          fi
          bash tool/release/smoke-macos.sh "${args[@]}"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tabame-${{ steps.metadata.outputs.version }}-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish-platform-assets:
    name: Upload macOS and Linux assets to the tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-deb
      - macos
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          pattern: tabame-*-*
          path: dist
          merge-multiple: true

      - name: Publish platform assets without changing Windows release behavior
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="$GITHUB_REF_NAME"
          release_ready=0
          for _ in $(seq 1 30); do
            if gh release view "$tag" >/dev/null 2>&1; then
              release_ready=1
              break
            fi
            sleep 10
          done
          if (( ! release_ready )); then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Tabame $tag" --generate-notes
          fi
          mapfile -t assets < <(find dist -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name '*.sha256' \) -print)
          (( ${#assets[@]} > 0 )) || { echo 'No platform release assets were downloaded.' >&2; exit 1; }
          gh release upload "$tag" "${assets[@]}" --clobber

name: Build Windows Store Installer Candidate

on:
  pull_request:
    paths:
      - ".github/workflows/release-packaging-windows-store.yml"
      - "lib/**"
      - "packaging/windows/store-installer/**"
      - "pubspec.yaml"
      - "tool/release/**"
      - "windows/**"
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the candidate with the protected Store signing environment."
        required: true
        default: false
        type: boolean
      run_install_smoke:
        description: "Run silent install, reinstall, uninstall, and data-retention smoke."
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "store-v*"

# This workflow is intentionally separate from windows-build.yml. It never moves
# the Nightly tag, creates a GitHub release, or uploads/replaces a ZIP asset.
permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  INNO_SETUP_VERSION: 6.4.2

concurrency:
  group: tabame-windows-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned-candidate:
    name: Build unsigned Store candidate
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
      candidate_name: ${{ steps.meta.outputs.candidate_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Check shared Windows import boundary
        shell: pwsh
        run: dart run tool/check_shared_windows_imports.dart

      - name: Analyze Dart and Flutter sources
        shell: pwsh
        run: flutter analyze

      - name: Run Flutter tests
        shell: pwsh
        run: flutter test

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $existing = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          if (-not $existing) {
            choco install innosetup --version=$env:INNO_SETUP_VERSION --no-progress --yes
          }
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -PathType Leaf) -and
              -not (Test-Path -LiteralPath "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -PathType Leaf)) {
            throw "Pinned Inno Setup $env:INNO_SETUP_VERSION was not installed."
          }

      - name: Build storeInstaller profile
        shell: pwsh
        run: flutter build windows --release --no-tree-shake-icons --dart-define=TABAME_DISTRIBUTION_PROFILE=storeInstaller

      - name: Prepare candidate metadata
        id: meta
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*([^\s+]+)') {
            throw "Could not find version in pubspec.yaml"
          }
          $appVersion = $Matches[1]
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Store candidate version must be three numeric components: $appVersion"
          }
          $currentVersion = [version]$appVersion
          $priorVersions = @(
            git tag --list "store-v*" | ForEach-Object {
              if ($_ -ne "store-v$appVersion" -and $_ -match '^store-v(\d+\.\d+\.\d+)$') {
                [version]$Matches[1]
              }
            }
          )
          $highestPrior = $priorVersions | Sort-Object | Select-Object -Last 1
          if ($highestPrior -and $currentVersion -le $highestPrior) {
            throw "Store version $appVersion must be greater than the previous Store version $highestPrior."
          }
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -ne "store-v$appVersion") {
            throw "Store tag ${{ github.ref_name }} does not match pubspec version store-v$appVersion."
          }
          $sourceDateEpoch = (git log -1 --format=%ct).Trim()
          if ($sourceDateEpoch -notmatch '^\d+$') {
            throw "Could not determine the release commit timestamp."
          }
          $candidateName = "tabame-v$appVersion-windows-store-installer"
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          "candidate_name=$candidateName" >> $env:GITHUB_OUTPUT
          "source_date_epoch=$sourceDateEpoch" >> $env:GITHUB_OUTPUT

      - name: Validate Store branding and source paths
        shell: pwsh
        run: |
          $iconPath = "windows\runner\resources\app_icon.ico"
          if (-not (Test-Path -LiteralPath $iconPath -PathType Leaf)) {
            throw "Store installer icon is missing: $iconPath"
          }
          if ((Get-Item -LiteralPath $iconPath).Length -le 0) {
            throw "Store installer icon is empty: $iconPath"
          }
          if ((Get-Content pubspec.yaml -Raw) -match '(?i)([A-Z]:\\|[A-Z]:/)') {
            throw "pubspec.yaml contains an absolute developer-machine path."
          }

      - name: Resolve dependency graph
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          dart pub deps --json | Out-File -FilePath dist\pub-deps.json -Encoding utf8

      - name: Package unsigned Store installer
        shell: pwsh
        run: |
          $releaseDir = @(
            "build\windows\x64\runner\Release",
            "build\windows\runner\Release"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -First 1
          if (-not $releaseDir) {
            throw "Could not find Flutter Windows release output."
          }
          $base = "dist\${{ steps.meta.outputs.candidate_name }}"
          & .\tool\release\package-windows-store-installer.ps1 `
            -ReleaseDir $releaseDir `
            -StageDir "dist\store-stage" `
            -InstallerPath "$base.exe" `
            -Sha256Path "$base.exe.sha256" `
            -ManifestPath "$base.manifest.json" `
            -SbomPath "$base.sbom.cdx.json" `
            -PartnerCenterMetadataPath "$base.partner-center.json" `
            -Version "${{ steps.meta.outputs.app_version }}" `
            -SourceDateEpoch "${{ steps.meta.outputs.source_date_epoch }}" `
            -CommitSha "${{ github.sha }}" `
            -DependencyJsonPath "dist\pub-deps.json"

      - name: Verify unsigned Store installer structure
        if: ${{ github.event_name == 'pull_request' || inputs.run_install_smoke != false }}
        shell: pwsh
        run: |
          $base = "dist\${{ steps.meta.outputs.candidate_name }}"
          & .\tool\release\verify-windows-store-installer.ps1 `
            -InstallerPath "$base.exe" `
            -Sha256Path "$base.exe.sha256" `
            -ManifestPath "$base.manifest.json" `
            -ExpectedVersion "${{ steps.meta.outputs.app_version }}" `
            -RunSilentInstallSmoke `
            -RunUpdateSmoke

      - name: Upload unsigned candidate for optional signing
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.candidate_name }}-unsigned-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  sign-candidate:
    name: Sign and verify Store candidate
    needs: build-unsigned-candidate
    if: ${{ inputs.sign == true || startsWith(github.ref, 'refs/tags/store-v') }}
    runs-on: windows-2022
    timeout-minutes: 45
    environment:
      name: windows-store-signing
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download unsigned candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-unsigned-candidate.outputs.candidate_name }}-unsigned-${{ github.run_id }}
          path: dist

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=$env:INNO_SETUP_VERSION --no-progress --yes
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -PathType Leaf) -and
              -not (Test-Path -LiteralPath "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -PathType Leaf)) {
            throw "Pinned Inno Setup $env:INNO_SETUP_VERSION was not installed."
          }

      - name: Import signing certificate into runner temp
        shell: pwsh
        env:
          TABAME_STORE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.TABAME_STORE_SIGNING_CERTIFICATE_BASE64 }}
          TABAME_STORE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.TABAME_STORE_SIGNING_CERTIFICATE_PASSWORD }}
          TABAME_STORE_TIMESTAMP_URL: ${{ secrets.TABAME_STORE_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TABAME_STORE_SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:TABAME_STORE_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "The windows-store-signing environment must provide the signing certificate and password."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "tabame-store-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:TABAME_STORE_SIGNING_CERTIFICATE_BASE64))
          "certificate_path=$certificatePath" >> $env:GITHUB_ENV

      - name: Sign every staged PE
        shell: pwsh
        env:
          TABAME_STORE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.TABAME_STORE_SIGNING_CERTIFICATE_PASSWORD }}
          TABAME_STORE_TIMESTAMP_URL: ${{ secrets.TABAME_STORE_TIMESTAMP_URL }}
        run: |
          & .\tool\release\sign-windows-store-installer.ps1 `
            -StageDir "dist\store-stage" `
            -CertificatePath "$env:certificate_path" `
            -CertificatePassword "$env:TABAME_STORE_SIGNING_CERTIFICATE_PASSWORD" `
            -TimestampUrl "$(if ($env:TABAME_STORE_TIMESTAMP_URL) { $env:TABAME_STORE_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' })"

      - name: Rebuild signed installer and signed uninstaller
        shell: pwsh
        env:
          TABAME_STORE_TIMESTAMP_URL: ${{ secrets.TABAME_STORE_TIMESTAMP_URL }}
          TABAME_STORE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.TABAME_STORE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $env:TABAME_STORE_SIGNING_CERTIFICATE_PATH = $env:certificate_path
          $base = "dist\${{ needs.build-unsigned-candidate.outputs.candidate_name }}"
          & .\tool\release\package-windows-store-installer.ps1 `
            -ReleaseDir "dist\store-stage" `
            -StageDir "dist\store-stage" `
            -UseExistingStage `
            -InstallerPath "$base.exe" `
            -Sha256Path "$base.exe.sha256" `
            -ManifestPath "$base.manifest.json" `
            -SbomPath "$base.sbom.cdx.json" `
            -PartnerCenterMetadataPath "$base.partner-center.json" `
            -Version "${{ needs.build-unsigned-candidate.outputs.app_version }}" `
            -SourceDateEpoch "${{ needs.build-unsigned-candidate.outputs.source_date_epoch }}" `
            -CommitSha "${{ github.sha }}" `
            -DependencyJsonPath "dist\pub-deps.json" `
            -SignToolScriptPath ".\tool\release\sign-inno-file.ps1"

      - name: Verify signed installer and silent lifecycle
        shell: pwsh
        env:
          TABAME_STORE_SIGNER_SUBJECT: ${{ secrets.TABAME_STORE_SIGNER_SUBJECT }}
        run: |
          $base = "dist\${{ needs.build-unsigned-candidate.outputs.candidate_name }}"
          $verifyArgs = @(
            '-InstallerPath', "$base.exe",
            '-Sha256Path', "$base.exe.sha256",
            '-ManifestPath', "$base.manifest.json",
            '-ExpectedVersion', "${{ needs.build-unsigned-candidate.outputs.app_version }}",
            '-RequireSigned',
            '-RunSilentInstallSmoke',
            '-RunUpdateSmoke'
          )
          if ($env:TABAME_STORE_SIGNER_SUBJECT) {
            $verifyArgs += @('-ExpectedPublisher', $env:TABAME_STORE_SIGNER_SUBJECT)
          }
          & .\tool\release\verify-windows-store-installer.ps1 @verifyArgs

      - name: Upload signed Store candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.build-unsigned-candidate.outputs.candidate_name }}-signed-${{ github.run_id }}
          path: |
            dist/${{ needs.build-unsigned-candidate.outputs.candidate_name }}.exe
            dist/${{ needs.build-unsigned-candidate.outputs.candidate_name }}.exe.sha256
            dist/${{ needs.build-unsigned-candidate.outputs.candidate_name }}.manifest.json
            dist/${{ needs.build-unsigned-candidate.outputs.candidate_name }}.sbom.cdx.json
            dist/${{ needs.build-unsigned-candidate.outputs.candidate_name }}.partner-center.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove certificate material
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:certificate_path -and (Test-Path -LiteralPath $env:certificate_path)) {
            Remove-Item -LiteralPath $env:certificate_path -Force
          }

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabame Connector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <img class="mark" src="icons/tabame.png" alt="" />
        <div>
          <p class="eyebrow">Browser link</p>
          <h1>Tabame Connector</h1>
        </div>
        <span id="stateLamp" class="state-lamp" aria-hidden="true"></span>
      </header>

      <section class="status-block" aria-live="polite">
        <div>
          <p id="statusTitle" class="status-title">Checking bridge…</p>
          <p id="statusDetail" class="status-detail">
            Looking for the Tabame launcher plugin.
          </p>
        </div>
        <button id="retryButton" class="icon-button" type="button">
          Retry
        </button>
      </section>

      <form id="pairingForm" class="pairing-form">
        <label for="tokenInput">
          <span>Pairing token</span>
          <span class="field-hint">from <kbd>browser</kbd> → Connection</span>
        </label>
        <input
          id="tokenInput"
          name="token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="Paste the local token"
        />

        <div class="port-row">
          <label for="portInput">Bridge port</label>
          <input
            id="portInput"
            name="port"
            type="number"
            min="1024"
            max="65535"
            value="17373"
          />
        </div>

        <button class="primary-button" type="submit">Save &amp; connect</button>
        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>

      <footer>
        <span>Local-only · token authenticated</span>
        <span id="versionLabel"></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
